<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="t d">
  <title id="t">어디서나 같은 절차</title>
  <desc id="d">워크스테이션, 공용 서버, HPC에서 같은 절차를 쓰고 컨테이너 엔진과 executor만 환경에 맞춘다. 그림: 세 종류의 컴퓨터가 하나의 Nextflow 흐름으로 모이고 Docker 또는 Apptainer와 local 또는 scheduler 설정으로 갈린다.</desc>
