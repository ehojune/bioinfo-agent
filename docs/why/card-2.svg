    .n { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .m { font-size: 9px; font-weight: 700; fill: #57606A; }
    .p { font-family: "Consolas", "Menlo", monospace; font-size: 9px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <rect x=".5" y=".5" width="479" height="259" rx="18" fill="#F2F7FF" stroke="#6EA8FA"/>
