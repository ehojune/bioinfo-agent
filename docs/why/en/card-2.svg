<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="t d">
  <title id="t">Same workflow, any host</title>
  <desc id="d">A workstation, shared server and HPC cluster use the same workflow; only the container engine and executor settings change. Illustration: three host types feed one Nextflow path, then branch to Docker or Apptainer and local or scheduler settings.</desc>
  <style>
    text { font-family: "Segoe UI", "Inter", Arial, sans-serif; fill: #1F2328; }
    .h { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .l { font-size: 15px; fill: #57606A; }
    .n { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .m { font-size: 9px; font-weight: 700; fill: #57606A; }
    .p { font-family: "Consolas", "Menlo", monospace; font-size: 9px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <rect x=".5" y=".5" width="479" height="259" rx="18" fill="#F2F7FF" stroke="#6EA8FA"/>
  <circle cx="392" cy="130" r="86" fill="#DCEBFF"/>
  <circle cx="42" cy="74" r="14" fill="#1A63CF"/>
  <text class="n" x="42" y="79" text-anchor="middle">2</text>
  <text class="h" x="28" y="128">Same workflow, any host</text>
  <text class="l" x="28" y="164">From workstation to HPC,</text>
  <text class="l" x="28" y="188">only engine and executor change.</text>

  <g fill="#FFFFFF" stroke="#57606A" stroke-width="2">
    <rect x="304" y="40" width="54" height="38" rx="5"/>
    <path d="M314 85h34M331 78v7"/>
    <rect x="373" y="38" width="44" height="43" rx="5"/>
    <path d="M381 50h28M381 59h28M381 68h28"/>
    <rect x="430" y="38" width="34" height="43" rx="5"/>
    <path d="M437 50h20M437 59h20M437 68h20"/>
  </g>
  <text class="m" x="331" y="98" text-anchor="middle">PC</text>
  <text class="m" x="395" y="98" text-anchor="middle">SERVER</text>
  <text class="m" x="447" y="98" text-anchor="middle">HPC</text>
  <path d="M331 104v20M395 104v20M447 104v20M331 124h116" fill="none" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="328" y="116" width="122" height="28" rx="14" fill="#4285F4"/>
  <text class="p" x="389" y="134" text-anchor="middle">NEXTFLOW</text>
  <path d="M389 144v18M389 162h-46M389 162h48" fill="none" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="304" y="171" width="82" height="25" rx="12.5" fill="#34A853"/>
  <text class="p" x="345" y="187" text-anchor="middle">Docker · local</text>
  <rect x="393" y="171" width="73" height="25" rx="12.5" fill="#1A63CF"/>
  <text class="p" x="429.5" y="187" text-anchor="middle">Apptainer</text>
  <rect x="393" y="202" width="73" height="20" rx="10" fill="#57606A"/>
  <text class="p" x="429.5" y="215.5" text-anchor="middle">scheduler</text>
</svg>
