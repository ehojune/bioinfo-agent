<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="t d">
  <title id="t">실패를 읽고 이어간다</title>
  <desc id="d">로그와 실패 task를 읽어 원인을 찾고 Nextflow resume으로 이어가며 MultiQC 지표로 QC 판정을 남긴다. 그림: 실패 로그가 resume 화살표를 거쳐 완료된 파이프라인과 QC 계기판으로 이어진다.</desc>
  <style>
    text { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; fill: #1F2328; }
    .h { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    .l { font-size: 15px; fill: #57606A; }
    .n { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .m { font-family: "Consolas", "Menlo", monospace; font-size: 10px; font-weight: 700; }
    .p { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#34A853"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="479" height="259" rx="18" fill="#F1FAF4" stroke="#56D364"/>
  <circle cx="392" cy="130" r="86" fill="#DDF4E4"/>
  <circle cx="42" cy="74" r="14" fill="#1A7F37"/>
  <text class="n" x="42" y="79" text-anchor="middle">3</text>
  <text class="h" x="28" y="128">실패를 읽고 이어간다</text>
  <text class="l" x="28" y="164">원인을 찾고 -resume으로 잇고,</text>
  <text class="l" x="28" y="188">MultiQC 지표로 판정한다</text>

  <rect x="302" y="40" width="96" height="74" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="2"/>
  <circle cx="314" cy="53" r="3" fill="#D1242F"/>
  <circle cx="324" cy="53" r="3" fill="#D4A72C"/>
  <circle cx="334" cy="53" r="3" fill="#34A853"/>
  <path d="M312 68h70M312 80h54M312 92h62" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
  <text class="m" x="312" y="107" fill="#D1242F">FAIL task 42</text>
  <path d="M400 78c32 1 43 17 35 42" fill="none" stroke="#34A853" stroke-width="3" marker-end="url(#a)"/>
  <rect x="403" y="68" width="62" height="21" rx="10.5" fill="#34A853"/>
  <text class="p" x="434" y="82" text-anchor="middle">-resume</text>
  <g fill="#FFFFFF" stroke="#57606A" stroke-width="2">
    <circle cx="326" cy="170" r="15"/>
    <circle cx="372" cy="170" r="15"/>
    <circle cx="418" cy="170" r="15"/>
  </g>
  <path d="M341 170h16M387 170h16" stroke="#34A853" stroke-width="3"/>
  <path d="M319 170l5 5 9-11M365 170l5 5 9-11M411 170l5 5 9-11" fill="none" stroke="#34A853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M437 163h17v38" fill="none" stroke="#34A853" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M401 217a31 31 0 0 1 62 0" fill="#FFFFFF" stroke="#57606A" stroke-width="2"/>
  <path d="M432 215l16-18" stroke="#34A853" stroke-width="3" stroke-linecap="round"/>
  <circle cx="432" cy="215" r="4" fill="#34A853"/>
  <text class="m" x="432" y="236" text-anchor="middle" fill="#1A7F37">QC PASS</text>
</svg>
