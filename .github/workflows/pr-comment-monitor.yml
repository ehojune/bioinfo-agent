name: PR Comment Monitor & Auto-Merge

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  monitor:
    name: Monitor PR Comments & Smart Actions
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: write
    
    steps:
      - name: Analyze PR and Comments
        id: analyze
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            let prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            if (!prNumber) {
              console.log('Not a PR event, skipping');
              return;
            }
            
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            const reviewComments = await github.rest.pulls.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            
            const issueComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            
            const allComments = [...reviewComments.data, ...issueComments.data];
            const comments = allComments.filter(c => 
              c.body && 
              !c.body.includes('<!-- -->') &&
              !c.body.match(/^Merge|^Auto-merge|^This branch/)
            );
            
            const commentCount = comments.length;
            console.log(`PR #${prNumber}: ${commentCount} comments`);
            
            let lastActor = '';
            let claudeLastTime = null;
            let codexLastTime = null;
            
            for (const comment of comments) {
              const author = comment.user.login;
              const body = comment.body.toLowerCase();
              const time = new Date(comment.created_at);
              
              let agent = 'unknown';
              if (author === 'ehojune') {
                agent = '🧑 you';
              } else if (author.includes('claude') || body.includes('claude code')) {
                agent = '🤖 claude';
                claudeLastTime = time;
              } else if (author.includes('codex') || body.includes('codex')) {
                agent = '🔧 codex';
                codexLastTime = time;
              }
              
              lastActor = agent;
            }
            
            const now = new Date();
            const threeHoursMs = 3 * 60 * 60 * 1000;
            const claudeTimedOut = claudeLastTime && (now - claudeLastTime) > threeHoursMs;
            const codexWaiting = codexLastTime && lastActor === '🔧 codex' && (!claudeLastTime || claudeLastTime < codexLastTime);
            
            core.setOutput('pr_number', prNumber);
            core.setOutput('comment_count', commentCount);
            core.setOutput('last_actor', lastActor);
            core.setOutput('claude_timed_out', claudeTimedOut);
            core.setOutput('codex_waiting', codexWaiting);
            
            let action = 'monitor';
            if (commentCount >= 20) action = 'merge';
            else if (commentCount >= 16) action = 'warn';
            else if (codexWaiting && claudeTimedOut) action = 'claude_timeout';
            
            core.setOutput('action', action);
      
      - name: "🟡 Warning at 16 comments"
        if: steps.analyze.outputs.action == 'warn'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.analyze.outputs.pr_number }}');
            const count = parseInt('${{ steps.analyze.outputs.comment_count }}');
            
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            if (existing.data.some(c => c.body.includes('🟡 Comment limit approaching'))) return;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🟡 **Comment limit approaching!**\n\nThis PR has reached **${count} of 20 comments**.\n\n@claude @codex — Please wrap up. Auto-merge at comment #20.\n\n⏰ Time to finalize!`
            });
      
      - name: "⏰ Claude timeout warning"
        if: steps.analyze.outputs.action == 'claude_timeout'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.analyze.outputs.pr_number }}');
            
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            if (existing.data.some(c => c.body.includes('Claude timeout'))) return;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `⏰ **Claude unresponsive for 3+ hours**\n\n@claude — Codex is waiting. Please respond.\n\n*If no response in next 3 hours, I will step in as Claude.*`
            });
      
      - name: "🟢 Auto-merge at 20 comments"
        if: steps.analyze.outputs.action == 'merge'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.analyze.outputs.pr_number }}');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🟢 **20 comments reached — Auto-merging now!**\n\n@claude: Time's up!\n\n*"Finish within 20 comments, or I merge."*`
            });
            
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            if (pr.data.state === 'open') {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: pr.data.title,
                  commit_message: `Auto-merged at 20 comments.\n\nPR: ${pr.data.html_url}`,
                });
              } catch (error) {
                try {
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    merge_method: 'merge',
                  });
                } catch (e) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `❌ Auto-merge failed. Manual merge needed.`
                  });
                }
              }
            }
