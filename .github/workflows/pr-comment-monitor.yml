name: PR Review Reminder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:

permissions: {}

jobs:
  test:
    name: Review reminder fixtures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/pr-comment-monitor.test.cjs

  monitor:
    name: Remind without merging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write
    concurrency:
      # A new pending job replaces the previous one even with cancel-in-progress: false.
      # Untrusted no-op events must never displace the trusted reminder queue.
      group: >-
        pr-review-reminder-${{ github.event.pull_request.number || github.event.issue.number }}-${{
        github.event.comment.user.login != 'github-actions[bot]' &&
        (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
        'trusted' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isPr = !!context.payload.pull_request || !!context.payload.issue?.pull_request;
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            if (!isPr || !prNumber) return;

            const associations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isTrusted = c => c?.user?.login !== 'github-actions[bot]' &&
              (associations.includes(c?.author_association) ||
               c?.user?.login === 'chatgpt-codex-connector[bot]');
            if (!isTrusted(context.payload.comment)) return;

            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: prNumber });
            const fullName = `${repo.owner}/${repo.repo}`;
            if (pr.state !== 'open' || pr.head.repo?.full_name !== fullName ||
                pr.base.repo?.full_name !== fullName) return;

            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments,
              { ...repo, pull_number: prNumber, per_page: 100 });
            const issueComments = await github.paginate(github.rest.issues.listComments,
              { ...repo, issue_number: prNumber, per_page: 100 });
            const count = [...reviewComments, ...issueComments].filter(c =>
              isTrusted(c) && typeof c.body === 'string' && c.body.trim()).length;
            if (count < 16) return;

            // Only our own marker deduplicates the reminder; arbitrary comments cannot suppress it.
            const marker = '<!-- bioinfo-review-reminder-v1 -->';
            if (issueComments.some(c => c.user?.login === 'github-actions[bot]' &&
                c.body?.includes(marker))) return;

            await github.rest.issues.createComment({
              ...repo,
              issue_number: prNumber,
              body: `${marker}\n**Review checkpoint: ${count} trusted comments.**\n\n` +
                'Summarize remaining findings, address or explicitly resolve them, and verify ' +
                'review and CI on the latest commit before deciding to merge. ' +
                'Comment count and elapsed time do not approve a PR; this workflow only posts this reminder.\n\n' +
                '🤖 Co-Authored-By: Codex (gpt-6.1-sol) <199175422+chatgpt-codex-connector[bot]@users.noreply.github.com>'
            });
